[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore"
version = "1.0.0"
description = "记忆原生 Agent 的记忆内核：快慢记忆双通道 + 写入门控 + 混合检索 + 巩固 + 遗忘，零第三方依赖"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Daily Agent" }]
keywords = ["memory", "agent", "llm", "fast-slow-memory", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]

[project.scripts]
memcore = "memcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
