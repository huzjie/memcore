apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memcore.fullname" . }}
  labels:
    app: memcore
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: memcore
  template:
    metadata:
      labels:
        app: memcore
    spec:
      containers:
        - name: memcore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "memcore.fullname" . }}-pvc
      {{- end }}
